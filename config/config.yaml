detection:
  model_path: model/best.onnx
  fallback_model: yolo11m.pt
  confidence_threshold: 0.4
  iou_threshold: 0.45
  device: cpu
  imgsz: 640
  drone_classes:
  - 0
  sahi:
    enabled: true
    slice_height: 512
    slice_width: 512
    overlap_ratio: 0.2
    postprocess_type: NMS
    postprocess_match_threshold: 0.5
  tta:
    enabled: true
tracker:
  confirmation_frames: 2
  max_age: 30
  n_init: 2
  max_cosine_distance: 0.4
  max_iou_distance: 0.9
  max_coast_frames: 5
  nn_budget: 100
  cross_camera_check: true
  cross_camera_window_s: 2.0
cameras:
  primary:
    source: 1
    fps: 25
    resolution:
    - 1280
    - 720
    label: "Camera 01 \u2014 Optical HD (USB)"
    azimuth_deg: 180.0
    camera_heading_deg: 180.0
alerting:
  cooldown_seconds: 45
  siren:
    enabled: true
    gpio_pin: 17
    duration_seconds: 30
  gsm_sms:
    enabled: true
    port: /dev/ttyUSB0
    baud_rate: 9600
    recipients:
    - +92300XXXXXXX
    - +92310XXXXXXX
    message_template: DRONE ALERT [{timestamp}] Cam:{camera_id} Bearing:{bearing}deg
      Count:{count}
  landline:
    enabled: false
    port: /dev/ttyS0
    dial_number: 0911
    message: Drone detected. Immediate response required.
  rf_comset:
    enabled: true
    port: /dev/ttyUSB1
    baud_rate: 115200
    channel: 5
    frequency_mhz: 433.05
    prerecorded_message: TACTICAL DRONE INTRUSION DETECTED AT {camera_id}. BEARING
      {bearing} DEGREES. DEPLOY AIR DEFENSE RESPONSE IMMEDIATELY.
    units:
    - id: RF-01
      name: Perimeter Guard Post Alpha
      callsign: VANGUARD-1
      address: '0x01'
      status: ACTIVE
    - id: RF-02
      name: Quick Reaction Force (QRF)
      callsign: STRIKER-2
      address: '0x02'
      status: ACTIVE
    - id: RF-03
      name: Tactical Operations Command
      callsign: OVERLORD-HQ
      address: '0x03'
      status: ACTIVE
    - id: RF-04
      name: Air Defense & Interceptor Post
      callsign: SHIELD-4
      address: '0x04'
      status: ACTIVE
    - id: RF-05
      name: Mobile Patrol Rover Team
      callsign: HAWK-5
      address: '0x05'
      status: ACTIVE
logging:
  level: INFO
  event_log_dir: logs/events
  snapshot_dir: logs/snapshots
  max_log_days: 30
  event_ring_buffer_size: 200
dashboard:
  host: 0.0.0.0
  port: 5000
  debug: false
  secret_key: drone-watch-2026-change-me-in-production
  max_snapshots_in_gallery: 20
bearing:
  camera_fov_horizontal: 90.0
  camera_fov_vertical: 60
  frame_width: 1280
  frame_height: 720
  camera_heading_deg: 180.0
system_health:
  check_interval_seconds: 30
  cpu_threshold_percent: 85
  memory_threshold_percent: 80
  disk_threshold_percent: 90
  temperature_threshold_celsius: 75
